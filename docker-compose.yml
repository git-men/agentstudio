# =============================================================================
# AgentStudio Docker Compose
# =============================================================================
#
# Default: Bun runtime (faster startup, lower memory)
#
# Usage:
#   docker-compose up -d                                    # Bun (default)
#   docker-compose --profile node up -d agentstudio-node    # Node.js
#
# =============================================================================

services:
  # Default: Bun Runtime (faster startup, lower memory)
  agentstudio:
    build:
      context: .
      dockerfile: Dockerfile
      target: bun
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: agentstudio
    ports:
      - "${PORT:-4936}:4936"
    environment:
      - NODE_ENV=production
      - PORT=4936
      - HOST=0.0.0.0
      - TZ=${TZ:-Asia/Shanghai}
    env_file:
      - .env
    volumes:
      - ${AGENTSTUDIO_HOME:-./data/home}:/home/agentstudio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4936/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Node.js Runtime (full compatibility fallback)
  # Usage: docker-compose --profile node up -d agentstudio-node
  agentstudio-node:
    profiles:
      - node
    build:
      context: .
      dockerfile: Dockerfile
      target: node
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: agentstudio-node
    ports:
      - "${PORT:-4936}:4936"
    environment:
      - NODE_ENV=production
      - PORT=4936
      - HOST=0.0.0.0
      - TZ=${TZ:-Asia/Shanghai}
    env_file:
      - .env
    volumes:
      - ${AGENTSTUDIO_HOME:-./data/home}:/home/agentstudio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4936/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
