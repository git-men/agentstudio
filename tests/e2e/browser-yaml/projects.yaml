name: "项目管理界面"
description: "测试项目列表页面加载、创建按钮和模态框"

setup:
  - name: "登录获取 token"
    request:
      method: POST
      url: "{{config.base_url}}/api/auth/login"
      headers:
        Content-Type: application/json
      body:
        password: ""
    expect:
      status: 200
      body:
        token: { exists: true, type: string }
    save:
      login_token: "token"

  - name: "注入认证令牌并关闭 Meta Agent 面板"
    browser:
      action: setLocalStorage
      storage:
        auth-storage: '{"state":{"token":"{{runtime.login_token}}","authenticated":true},"version":0}'
        "agentstudio:meta-agent-open": "0"
  - name: "进入仪表盘"
    browser:
      action: goto
      url: "/dashboard"
  - name: "等待加载"
    browser:
      action: waitForLoadState
      state: networkidle

cases:
  - name: "项目页面加载"
    browser:
      action: goto
      url: "/projects"

  - name: "等待页面加载"
    browser:
      action: waitForLoadState
      state: networkidle

  - name: "验证项目管理标题"
    browser:
      action: waitForSelector
      selector: "h1:has-text('Project Management'), h1:has-text('项目管理')"
      timeout: "10s"

  - name: "验证搜索框存在"
    browser:
      action: waitForSelector
      selector: "input[placeholder*='Search'], input[placeholder*='搜索']"
    expect:
      page:
        visible:
          - "button:has-text('Create'), button:has-text('创建')"

  - name: "确保 Meta Agent 面板关闭"
    browser:
      action: evaluate
      script: "localStorage.setItem('agentstudio:meta-agent-open', '0'); document.querySelector('[class*=\"fixed z-50\"][class*=\"pointer-events-auto\"]')?.remove();"
    ignoreError: true

  - name: "等待 UI 稳定"
    delay: "500ms"
    browser:
      action: waitForLoadState
      state: domcontentloaded

  - name: "打开创建项目模态框"
    browser:
      action: click
      selector: "button:has-text('Create New Project'), button:has-text('创建')"
      force: true

  - name: "等待模态框出现"
    browser:
      action: waitForSelector
      selector: "[role='dialog'], .fixed.inset-0:not([class*='pointer-events-none'])"
      timeout: "5s"
    expect:
      page:
        visible:
          - "input"

  - name: "关闭模态框"
    browser:
      action: press
      key: "Escape"

  - name: "等待模态框关闭"
    delay: "1s"
    browser:
      action: waitForLoadState
      state: domcontentloaded

  - name: "项目列表 API 正常响应"
    request:
      method: GET
      path: "/api/projects"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "项目表格或空状态可渲染"
    browser:
      action: goto
      url: "/projects"

  - name: "等待页面加载"
    browser:
      action: waitForLoadState
      state: networkidle
    expect:
      page:
        visible:
          - "h1:has-text('Project'), h1:has-text('项目')"
