name: "后端服务自动发现"
description: "验证同域后端自动发现后，默认服务被就地更新（名称为 Default、状态已连接），而非创建 Same-Origin Backend 新条目"

cases:
  - name: "首次访问触发自动发现"
    browser:
      action: goto
      url: "/"

  - name: "等待自动发现完成"
    browser:
      action: waitForLoadState
      state: networkidle

  - name: "进入登录页"
    browser:
      action: goto
      url: "/login"

  - name: "等待登录页加载"
    browser:
      action: waitForLoadState
      state: networkidle

  - name: "等待页面跳转或按钮出现"
    delay: "2s"
    browser:
      action: waitForLoadState
      state: networkidle
      timeout: "15s"

  - name: "导航到仪表盘"
    browser:
      action: goto
      url: "/dashboard"

  - name: "等待仪表盘加载"
    browser:
      action: waitForLoadState
      state: networkidle

  - name: "验证页面已加载"
    browser:
      action: waitForSelector
      selector: "nav, aside, [class*='sidebar'], main"
      timeout: "10s"
