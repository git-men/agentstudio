name: 插件与市场
sequential: true

setup:
  - name: "登录获取 token"
    request:
      method: POST
      url: "{{config.base_url}}/api/auth/login"
      headers:
        Content-Type: application/json
      body:
        password: ""
    expect:
      status: 200
      body:
        token: { exists: true, type: string }
    save:
      login_token: "token"

cases:
  - name: "获取市场列表"
    request:
      method: GET
      url: "{{config.base_url}}/api/plugins/marketplaces"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取可用插件"
    request:
      method: GET
      url: "{{config.base_url}}/api/plugins/available"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取已安装插件"
    request:
      method: GET
      url: "{{config.base_url}}/api/plugins/installed"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "检查所有市场更新"
    request:
      method: GET
      url: "{{config.base_url}}/api/plugins/marketplaces/check-all-updates"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取市场技能列表"
    request:
      method: GET
      url: "{{config.base_url}}/api/marketplace-skills"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200
