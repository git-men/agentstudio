name: 模型供应商可用性检查
sequential: true

setup:
  - name: "登录获取 token"
    request:
      method: POST
      url: "{{config.base_url}}/api/auth/login"
      headers:
        Content-Type: application/json
      body:
        password: ""
    expect:
      status: 200
      body:
        token: { exists: true, type: string }
    save:
      login_token: "token"

cases:
  - name: "获取 Claude 版本列表，确认系统版本存在"
    request:
      method: GET
      url: "{{config.base_url}}/api/settings/claude-versions"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200
      body:
        versions:
          length: { gt: 0 }
          some:
            isSystem: true

  - name: "系统版本可用性检查返回结果"
    description: "系统版本使用本地 CLI，当 CLI 已安装时 available=true"
    request:
      method: POST
      url: "{{config.base_url}}/api/settings/claude-versions/claude/test"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
        Content-Type: application/json
    expect:
      status: 200

  - name: "不存在的版本 ID 返回 404"
    request:
      method: POST
      url: "{{config.base_url}}/api/settings/claude-versions/non-existent-id/test"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
        Content-Type: application/json
    expect:
      status: 404

  - name: "创建带 API Key 的测试版本（指向 Mock）"
    request:
      method: POST
      url: "{{config.base_url}}/api/settings/claude-versions"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
        Content-Type: application/json
      body:
        name: "e2e-test-provider"
        alias: "e2e-test-{{timestamp}}"
        description: "E2E 测试用供应商"
        environmentVariables:
          ANTHROPIC_API_KEY: "test-key-for-e2e"
          ANTHROPIC_BASE_URL: "http://host.docker.internal:9091"
    expect:
      status: 200
      body:
        id: { exists: true }
        name: "e2e-test-provider"
        isSystem: false
    save:
      test_version_id: "id"

  - name: "自定义版本健康检查有响应"
    description: "Mock 服务不在线时 available=false 也是合理结果"
    request:
      method: POST
      url: "{{config.base_url}}/api/settings/claude-versions/{{runtime.test_version_id}}/test"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
        Content-Type: application/json
    expect:
      status: 200

  - name: "将测试版本设为默认供应商"
    request:
      method: PUT
      url: "{{config.base_url}}/api/settings/claude-versions/{{runtime.test_version_id}}/set-default"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "版本列表中 defaultVersionId 正确指向非系统供应商"
    request:
      method: GET
      url: "{{config.base_url}}/api/settings/claude-versions"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200
      body:
        defaultVersionId: "{{runtime.test_version_id}}"

teardown:
  - name: "清理测试版本"
    request:
      method: DELETE
      url: "{{config.base_url}}/api/settings/claude-versions/{{runtime.test_version_id}}"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    ignoreError: true
