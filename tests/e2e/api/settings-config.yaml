name: 设置与配置信息
sequential: true

setup:
  - name: "登录获取 token"
    request:
      method: POST
      url: "{{config.base_url}}/api/auth/login"
      headers:
        Content-Type: application/json
      body:
        password: ""
    expect:
      status: 200
      body:
        token: { exists: true, type: string }
    save:
      login_token: "token"

cases:
  - name: "获取配置信息"
    request:
      method: GET
      url: "{{config.base_url}}/api/config"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取全局记忆设置"
    request:
      method: GET
      url: "{{config.base_url}}/api/settings/global-memory"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取版本设置"
    request:
      method: GET
      url: "{{config.base_url}}/api/settings/versions"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取版本号"
    request:
      method: GET
      url: "{{config.base_url}}/api/version"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取版本详情"
    request:
      method: GET
      url: "{{config.base_url}}/api/version/info"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200

  - name: "获取网络信息"
    request:
      method: GET
      url: "{{config.base_url}}/api/network-info"
      headers:
        Authorization: "Bearer {{runtime.login_token}}"
    expect:
      status: 200
