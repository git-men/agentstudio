    issue: |
      [继承 Round 1] 外层 catch 对 EEXIST 的处理仍然静默吞噬，不检查路径上实际存在的是什么。
      在非并发场景下（如先前安装残留了指向错误目标的 symlink 且 lstatSync 未能检出），
      此分支会静默跳过而不产生任何可操作信息。
      此问题不阻塞合并，但建议加强 warn 日志的信息量。
    suggestion: |
      在 EEXIST warn 中输出预期目标路径，便于排查：
        console.warn(
          `Skipping ${type} symlink (EEXIST race condition): ${symlinkPath} -> expected ${sourcePath}`
        );

  - severity: MEDIUM
    location: "backend/src/services/pluginSymlink.ts:110"
    issue: |
      [继承 Round 1] symlink 目标路径比较使用严格字符串相等（existingTarget === sourcePath），
      在大小写不敏感文件系统（macOS HFS+/APFS）上，路径大小写不同时会错误触发 unlink + recreate。
      不阻塞合并，属于后续改进项。
    suggestion: |
      使用 path.resolve() 规范化两侧路径后再比较：
        if (path.resolve(existingTarget) === path.resolve(sourcePath)) { return; }

